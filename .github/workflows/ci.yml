name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt headless system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

      - name: Verify PyInstaller build
        shell: pwsh
        run: |
          pyinstaller desktop_dancer.spec
          $exe = "dist/desktop-dancer.exe"
          if (-not (Test-Path $exe)) { throw "exe not built" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "exe suspiciously small" }
          Write-Host "OK $([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB"
